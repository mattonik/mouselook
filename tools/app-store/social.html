<!doctype html>
<!-- GitHub social preview, 1280 x 640 (render.mjs social). Same colors as
     the App Store screenshots. -->
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --navy-deep: #0a0f1c;
    --navy: #1b2640;
    --ice: #5ee1ff;
    --text: #e8eefc;
    --muted: #9fb0d0;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    background:
      radial-gradient(700px 500px at 20% 0%, rgba(47, 123, 255, 0.35), transparent 70%),
      linear-gradient(160deg, var(--navy) 0%, var(--navy-deep) 75%);
    font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
    color: var(--text);
    position: relative;
  }
  .text { position: absolute; left: 72px; top: 0; bottom: 0; width: 490px;
          display: flex; flex-direction: column; justify-content: center; }
  .icon { width: 112px; height: 112px; border-radius: 26px; overflow: hidden;
          box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5); }
  .icon img { width: 100%; height: 100%; display: block; }
  h1 { margin-top: 32px; font-size: 76px; font-weight: 700; letter-spacing: -1.5px; }
  p { margin-top: 16px; font-size: 29px; line-height: 1.3; color: var(--muted); }
  .tags { margin-top: 28px; font-size: 22px; color: var(--ice); letter-spacing: 0.5px; }
  .screen { position: absolute; left: 580px; top: 90px; width: 820px; height: 615px;
            border-radius: 28px; overflow: hidden;
            border: 2px solid rgba(94, 225, 255, 0.25);
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.6), 0 0 0 8px rgba(10, 15, 28, 0.9); }
  .screen img { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
  <div class="text">
    <div class="icon"><img src="{{icon}}" alt=""></div>
    <h1>Mouselook</h1>
    <p>A real mouse for the web on iPad,<br>for Figma and cloud games.</p>
    <div class="tags">Open source · Apache 2.0</div>
  </div>
  <div class="screen"><img src="{{screen}}" alt=""></div>
</body>
</html>
