<!doctype html>
<!-- One App Store screenshot, 2752 x 2064. render.mjs fills in the caption
     and the screen. Colors are the app icon's (design/icon/mouselook.svg). -->
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --navy-deep: #0a0f1c;
    --navy: #1b2640;
    --blue: #2f7bff;
    --ice: #5ee1ff;
    --text: #e8eefc;
    --muted: #9fb0d0;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 2752px; height: 2064px; overflow: hidden; }
  body {
    background:
      radial-gradient(1600px 900px at 50% -10%, rgba(47, 123, 255, 0.35), transparent 70%),
      linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 70%);
    font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 136px;
  }
  h1 {
    font-size: 120px;
    font-weight: 700;
    letter-spacing: -2px;
    line-height: 1.1;
    text-align: center;
  }
  p {
    margin-top: 32px;
    font-size: 60px;
    font-weight: 400;
    color: var(--muted);
    text-align: center;
  }
  .screen {
    margin-top: 104px;
    width: 1920px;
    height: 1440px;
    border-radius: 48px;
    overflow: hidden;
    border: 3px solid rgba(94, 225, 255, 0.25);
    box-shadow: 0 40px 120px rgba(0, 0, 0, 0.6), 0 0 0 12px rgba(10, 15, 28, 0.9);
  }
  .screen img { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
  <h1>{{title}}</h1>
  <p>{{subtitle}}</p>
  <div class="screen"><img src="{{screen}}" alt=""></div>
</body>
</html>
