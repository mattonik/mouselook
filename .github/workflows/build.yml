name: Build

# On every pull request, on merges to main, and on demand. The repository is
# public, so GitHub-hosted runners (macOS included) cost nothing.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR or branch makes an older, still-running check
# pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  polyfill-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test

  ios-tests:
    # Building for tests also builds the app, so this one job covers both.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Use the newest Xcode 26
        # Xcode 16's iOS 18 simulator lacks libswiftWebKit.dylib, which the
        # app links, so the test host crashed before any test ran.
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build and unit-test on an iPad Simulator
        run: |
          # An iPad on the newest iOS runtime this Xcode has.
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, re, sys
          devices = json.load(sys.stdin)['devices']
          version = lambda runtime: [int(n) for n in re.findall(r'\d+', runtime.rsplit('iOS', 1)[-1])]
          ipads = [(version(r), x['udid']) for r, l in devices.items() if 'iOS' in r for x in l if x['name'].startswith('iPad')]
          print(max(ipads)[1])")
          xcrun simctl list devices | grep "$UDID"
          xcodebuild test \
            -project PointerLocker.xcodeproj \
            -scheme PointerLocker \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO
