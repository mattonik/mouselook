name: Build

on:
  push:
  pull_request:

jobs:
  polyfill-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test

  ios-build:
    runs-on: macos-15
    strategy:
      matrix:
        scheme: [PointerLocker, MouseLockPrototype]
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode 26
        # Xcode 16's iOS 18 simulator lacks libswiftWebKit.dylib, which the
        # app links, so the test host crashed before any test ran.
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build for iOS Simulator (unsigned)
        run: |
          xcodebuild build \
            -project PointerLocker.xcodeproj \
            -scheme ${{ matrix.scheme }} \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  ios-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode 26
        # Xcode 16's iOS 18 simulator lacks libswiftWebKit.dylib, which the
        # app links, so the test host crashed before any test ran.
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Unit tests on an iPad Simulator
        run: |
          # An iPad on the newest iOS runtime this Xcode has.
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, re, sys
          devices = json.load(sys.stdin)['devices']
          version = lambda runtime: [int(n) for n in re.findall(r'\d+', runtime.rsplit('iOS', 1)[-1])]
          ipads = [(version(r), x['udid']) for r, l in devices.items() if 'iOS' in r for x in l if x['name'].startswith('iPad')]
          print(max(ipads)[1])")
          xcrun simctl list devices | grep "$UDID"
          xcodebuild test \
            -project PointerLocker.xcodeproj \
            -scheme PointerLocker \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO
